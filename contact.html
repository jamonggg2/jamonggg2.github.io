    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="조성환에게 연락하기" />
        <title>연락처 | 조성환 포트폴리오</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />
        <link href="css/custom.css" rel="stylesheet" />
    </head>
    <body class="pf d-flex flex-column">
        <header class="pf-header">
            <nav class="navbar navbar-expand-lg navbar-dark">
                <div class="pf-container d-flex flex-wrap align-items-center justify-content-between w-100">
                    <a class="pf-brand" href="index.html">
                        <span class="pf-logo" aria-hidden="true">S</span>
                        <span>
                            <span class="pf-brand__name">Seonghwan Jo</span>
                            <span class="pf-brand__sub">Developer Portfolio</span>
                        </span>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#pfNav" aria-controls="pfNav" aria-expanded="false" aria-label="메뉴 열기"><span class="navbar-toggler-icon"></span></button>
                    <div class="collapse navbar-collapse justify-content-lg-end" id="pfNav">
                        <ul class="navbar-nav pf-nav mt-3 mt-lg-0">
                            <li class="nav-item"><a class="nav-link" href="index.html">홈</a></li>
                            <li class="nav-item"><a class="nav-link" href="resume.html">경력</a></li>
                            <li class="nav-item"><!-- 임시 비활성화: 복구하려면 href="projects.html" 을 되살리고 disabled 관련 속성을 지우세요 --><a class="nav-link disabled" aria-disabled="true" tabindex="-1" title="준비 중입니다">프로젝트</a></li>
                            <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">연락처</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="pf-main flex-grow-1">
            <div class="pf-container">
                <p class="pf-eyebrow">Contact</p>
                <h1 class="pf-title">이야기 나눠요</h1>
                <p class="pf-lead">협업 제안, 채용, 간단한 질문 모두 환영합니다. 보통 2~3일 안에 답장드려요.</p>

                <div class="pf-contact">
                    <!-- 연락 방법 -->
                    <section class="pf-card pf-card--dark" aria-label="연락 방법">
                        <i class="bi bi-envelope pf-card__icon" style="color: var(--pf-lime);" aria-hidden="true"></i>
                        <h2 class="pf-card__title">다른 방법으로도 연락할 수 있어요</h2>
                        <p class="pf-card__text" style="color: var(--pf-muted);">아래 링크 중 편한 곳으로 남겨 주세요.</p>
                        <ul class="pf-contact__links">
                            <li><a href="mailto:jolilyseonghwan@gmail.com"><i class="bi bi-envelope" aria-hidden="true"></i> jolilyseonghwan@gmail.com</a></li>
                            <li><a href="https://github.com/jamonggg2"><i class="bi bi-github" aria-hidden="true"></i> github.com/jamonggg2</a></li>
                            <li><span><i class="bi bi-geo-alt" aria-hidden="true"></i> 서울, 대한민국</span></li>
                        </ul>
                    </section>

                    <!-- 문의 폼 (샘플: 실제 전송 기능은 연결되어 있지 않음) -->
                    <section class="pf-card pf-card--lime" aria-label="문의 폼">
                        <form id="contactForm" action="mailto:hello@example.com" method="post" enctype="text/plain">
                            <div class="pf-field">
                                <label for="name">이름</label>
                                <input id="name" name="name" type="text" required autocomplete="name" />
                            </div>
                            <div class="pf-field">
                                <label for="email">이메일</label>
                                <input id="email" name="email" type="email" required autocomplete="email" />
                            </div>
                            <div class="pf-field">
                                <label for="message">메시지</label>
                                <textarea id="message" name="message" required></textarea>
                            </div>
                            <!-- 임시 비활성화: 복구하려면 disabled, title 속성을 지우세요 --><button class="pf-btn pf-btn--ink pf-btn--block" type="submit" disabled title="준비 중입니다">보내기 <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
                        </form>
                    </section>
                </div>
            </div>
        </main>

        <footer class="pf-footer">
            <div class="pf-container d-flex flex-wrap justify-content-between gap-2">
                <span>&copy; 2026 Seonghwan Jo</span>
                <span><a href="https://github.com/jamonggg2">GitHub</a> &middot; <a href="contact.html">Contact</a></span>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
    </body>
</html>
